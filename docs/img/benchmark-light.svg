<svg xmlns="http://www.w3.org/2000/svg" width="780" height="328" viewBox="0 0 780 328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Median cost per task by arm, with answer quality">
