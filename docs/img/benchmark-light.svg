<text x="514.0" y="103" font-size="13" fill="#0b0b0b">$0.070</text>
<text x="618" y="103" font-size="14" font-weight="600" fill="#0b0b0b">0.931</text>
<text x="24" y="141" font-size="14" font-weight="600" fill="#0b0b0b">devkb, 12 tools</text>
<text x="24" y="158" font-size="12" fill="#52514e">single-question tools</text>
<path d="M206,132 h247.5 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-247.5 z" fill="#2a78d6"><title>devkb, 12 tools: $0.059 median per task</title></path>
<text x="465.5" y="149" font-size="13" fill="#0b0b0b">$0.059  ·  18% cheaper</text>
<text x="618" y="149" font-size="14" font-weight="600" fill="#0b0b0b">0.955</text>
<text x="666" y="149" font-size="12" fill="#006300">+0.024</text>
<text x="24" y="187" font-size="14" font-weight="600" fill="#0b0b0b">devkb, 7 tools</text>
<text x="24" y="204" font-size="12" fill="#52514e">lean MCP tool set</text>
<path d="M206,178 h168.1 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-168.1 z" fill="#2a78d6"><title>devkb, 7 tools: $0.040 median per task</title></path>
<text x="386.1" y="195" font-size="13" fill="#0b0b0b">$0.040  ·  38% cheaper</text>
