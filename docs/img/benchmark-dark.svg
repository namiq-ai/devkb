<svg xmlns="http://www.w3.org/2000/svg" width="780" height="328" viewBox="0 0 780 328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Median cost per task by arm, with answer quality">
<rect width="780" height="328" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#f0efec">Cost per task, and how good the answers were</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">1,038 agent runs, 52 tasks, 7 open-source repositories, the same model (Sonnet) in every arm</text>
<text x="618" y="72" font-size="12" fill="#898781">answer quality (0–1)</text>
<text x="24" y="95" font-size="14" font-weight="600" fill="#f0efec">Plain search</text>
<text x="24" y="112" font-size="12" fill="#c3c2b7">search and read files</text>
<path d="M206,86 h296.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-296.0 z" fill="#6b6a65"><title>Plain search: $0.075 median per task</title></path>
<text x="514.0" y="103" font-size="13" fill="#f0efec">$0.075</text>
<text x="618" y="103" font-size="14" font-weight="600" fill="#f0efec">0.928</text>
<text x="24" y="141" font-size="14" font-weight="600" fill="#f0efec">devkb, 12 tools</text>
<text x="24" y="158" font-size="12" fill="#c3c2b7">single-question tools</text>
<path d="M206,132 h236.4 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-236.4 z" fill="#3987e5"><title>devkb, 12 tools: $0.060 median per task</title></path>
<text x="454.4" y="149" font-size="13" fill="#f0efec">$0.060  ·  19% cheaper</text>
<text x="618" y="149" font-size="14" font-weight="600" fill="#f0efec">0.951</text>
<text x="666" y="149" font-size="12" fill="#0ca30c">+0.023</text>
<text x="24" y="187" font-size="14" font-weight="600" fill="#f0efec">devkb, 7 tools</text>
<text x="24" y="204" font-size="12" fill="#c3c2b7">lean MCP tool set</text>
<path d="M206,178 h161.7 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-161.7 z" fill="#3987e5"><title>devkb, 7 tools: $0.042 median per task</title></path>
<text x="379.7" y="195" font-size="13" fill="#f0efec">$0.042  ·  39% cheaper</text>
<text x="618" y="195" font-size="14" font-weight="600" fill="#f0efec">0.961</text>
<text x="666" y="195" font-size="12" fill="#0ca30c">+0.033</text>
<text x="24" y="233" font-size="14" font-weight="600" fill="#f0efec">devkb pack</text>
<text x="24" y="250" font-size="12" fill="#c3c2b7">pre-computed context</text>
<path d="M206,224 h100.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-100.9 z" fill="#3987e5"><title>devkb pack: $0.026 median per task</title></path>
<text x="318.9" y="241" font-size="13" fill="#f0efec">$0.026  ·  56% cheaper</text>
<text x="618" y="241" font-size="14" font-weight="600" fill="#f0efec">0.979</text>
<text x="666" y="241" font-size="12" fill="#0ca30c">+0.051</text>
<line x1="206" y1="78" x2="206" y2="258" stroke="#383835" stroke-width="1"/>
<text x="24" y="284" font-size="12" fill="#898781">Bars: median cost per task (US$). "Cheaper": the per-task saving against plain search, averaged over tasks; quality: mean score.</text>
<text x="24" y="302" font-size="12" fill="#898781">95% intervals, per-task detail and corrections: bench/results/2026-11-15-registry</text>
