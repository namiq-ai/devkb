[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devkb"
version = "0.2.15"
description = "A software-process knowledge graph for software development agents: extraction, pre-computed context packs, and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hung T. Le" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["knowledge graph", "software development agents", "coding agents", "mcp", "code intelligence", "call graph", "software process"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/namiq-ai/devkb"
Issues = "https://github.com/namiq-ai/devkb/issues"
Benchmark = "https://github.com/namiq-ai/devkb/blob/main/docs/BENCHMARK.md"

[project.optional-dependencies]
mcp = ["mcp>=1.23,<2"]
study = ["scipy>=1.10"]
dev = ["pytest>=8", "mcp>=1.23,<2", "scipy>=1.10"]

[project.scripts]
devkb = "devkb.cli:main"

[tool.setuptools.packages.find]
include = ["devkb*"]

[tool.setuptools.package-data]
devkb = ["*.md"]
