# Dogfood repositories per language beyond Python (Python's are bench/repos.yaml, with tasks and truth).
# Rule: every language devkb adds is checked on at least 3 real public repositories (decided 2026-11-16).
# `python -m devkb.bench.languages check` clones each at its pinned commit, builds the graph, and fails if the
# language's symbols, calls or test cases fall below the minimums (about 80% of what was measured when added).
# Precision samples, checked by hand against the source, are in docs/specs/ (C#: csharp-precision-sample.md).
languages:
  csharp:
    source: ast-csharp
    repos:
      - {id: mediatr, url: https://github.com/jbogard/MediatR.git, commit: 1fad4c7a35c8dd4e733a0f8d43e28eddc1aa5f5b, min_symbols: 1250, min_calls: 620, min_tests: 195}
      - {id: fluentvalidation, url: https://github.com/FluentValidation/FluentValidation.git, commit: 5903fa65863ec66dabf10646b9c09b33130a03e8, min_symbols: 1790, min_calls: 3700, min_tests: 670}
      - {id: polly, url: https://github.com/App-vNext/Polly.git, commit: 3bac1c877ac5b94f0c09cbf4efe4c15fafce639d, min_symbols: 4470, min_calls: 5470, min_tests: 2110}
      # big, well-known projects (SPEC-DEVKB-CSHARP-2): a media server and Microsoft's ORM, 1.8M lines
      - {id: jellyfin, url: https://github.com/jellyfin/jellyfin.git, commit: 2953ed632c9277351483eff04f87a8276390691c, min_symbols: 13500, min_calls: 10840, min_tests: 1230}
      - {id: efcore, url: https://github.com/dotnet/efcore.git, commit: 8859f78f10d013a06385c5817ab318414399f66f, min_symbols: 93750, min_calls: 110650, min_tests: 16200}
  # C and C++ (SPEC-DKB-004 F7, #122). Both read by the one C/C++ extractor, so one `source`; a repository counts toward the language its code is
  # in. Measured 2026-11-22 on this branch's extractor; minimums are about 80% of the measured value. Zephyr (136k symbols, 3.6 minutes to build) stays
  # in the corpus check (devkb/bench/cpp_corpus.json, bench/perf.py), not here: this check runs on every push.
  c:
    source: cpp-symbols
    repos:
      - {id: cjson, url: https://github.com/DaveGamble/cJSON.git, commit: 6d9f2443ab071f86e5d9b43025a40929ec41c46c, min_symbols: 935, min_calls: 2500, min_tests: 214}
      - {id: autoas, url: https://github.com/autoas/as.git, commit: cc3709675ac30f7539c0710dfec6d579a5235841, min_symbols: 3600, min_calls: 3590, min_tests: 2}
      - {id: lua, url: https://github.com/lua/lua.git, commit: c42d820bc0c3bc4f2ad536e19d2f05405af10387, min_symbols: 1095, min_calls: 3310, min_tests: 0}
  cpp:
    source: cpp-symbols
    repos:
      - {id: fmt, url: https://github.com/fmtlib/fmt.git, commit: 57f1b5930dc2906875534a15c209e1c39eda59ad, min_symbols: 2445, min_calls: 2035, min_tests: 550}
      - {id: leveldb, url: https://github.com/google/leveldb.git, commit: 29465588d3dfdc80fba5e198037582b8fdb5dd60, min_symbols: 1465, min_calls: 2720, min_tests: 185}
      - {id: yaml-cpp, url: https://github.com/jbeder/yaml-cpp.git, commit: f473f3bdfed25271ebd3d268caedc1b0b7f5ff50, min_symbols: 5130, min_calls: 5205, min_tests: 3050}
